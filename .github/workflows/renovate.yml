name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      # Allow Renovate to create and merge PRs
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for RENOVATE_TOKEN
        id: token-check
        shell: bash
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "RENOVATE_TOKEN secret not configured — skipping Renovate."
            echo "See .github/SETUP_CHECKLIST.md to set up the token."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        if: steps.token-check.outputs.configured == 'true'
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
