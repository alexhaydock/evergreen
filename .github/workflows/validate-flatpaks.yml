name: Validate Flatpaks
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "rootfs/etc/flatpak/preinstall.d/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flathub
        shell: bash
        run: |
          sudo apt install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate Flatpaks
        shell: bash
        run: |
          echo "Validating flatpak files in custom/flatpak/ directory..."

          set -xeuo pipefail

          find "rootfs/etc/flatpak" -iname '*.preinstall' -print0 | \
            while IFS= read -r -d '' flatpaks_file; do \
              echo "::group:: ===$(basename "$flatpaks_file")==="
              sed -n 's/^\[Flatpak Preinstall \([^]]*\)\]$/\1/p' "$flatpaks_file" | \
                while read -r flatpak; do \
                  flatpak remote-info --user flathub "${flatpak}"
                done
              echo "::endgroup::"
            done
